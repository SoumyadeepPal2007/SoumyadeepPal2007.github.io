<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="ep-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1726" />
      <stop offset="60%" stop-color="#141c38" />
      <stop offset="100%" stop-color="#1b2554" />
    </linearGradient>
    <linearGradient id="ep-blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>

  <rect width="600" height="360" fill="url(#ep-bg)"/>

  <!-- Background Orbit / Learning Constellation Rings -->
  <ellipse cx="200" cy="180" rx="160" ry="80" fill="none" stroke="rgba(59, 130, 246, 0.2)" stroke-width="1.5" transform="rotate(-15 200 180)"/>
  <ellipse cx="200" cy="180" rx="120" ry="60" fill="none" stroke="rgba(6, 182, 212, 0.25)" stroke-width="1.5" stroke-dasharray="6 4" transform="rotate(25 200 180)"/>

  <!-- Stylized AI Graduation / Learning Symbol -->
  <g transform="translate(170, 160)">
    <!-- Graduation Cap Icon Base -->
    <polygon points="0,-40 60,-20 0,0 -60,-20" fill="url(#ep-blue)"/>
    <polygon points="0,-35 50,-18 0,-1 -50,-18" fill="#1e293b"/>
    <!-- Mortarboard Under-arch -->
    <path d="M -35 -10 L -35 15 C -35 30, 35 30, 35 15 L 35 -10" fill="none" stroke="url(#ep-blue)" stroke-width="3"/>
    <!-- Tassel -->
    <path d="M 40 -15 L 55 5 L 52 25" fill="none" stroke="#f59e0b" stroke-width="2.5"/>
    <circle cx="52" cy="27" r="4" fill="#f59e0b"/>

    <!-- Neural AI Nodes surrounding learning hub -->
    <circle cx="-50" cy="50" r="5" fill="#38bdf8"/>
    <circle cx="50" cy="50" r="5" fill="#a855f7"/>
    <circle cx="0" cy="70" r="6" fill="#10b981"/>
    <line x1="-35" y1="20" x2="-50" y2="50" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.5"/>
    <line x1="35" y1="20" x2="50" y2="50" stroke="rgba(168, 85, 247, 0.4)" stroke-width="1.5"/>
    <line x1="0" y1="25" x2="0" y2="70" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1.5"/>
  </g>

  <!-- Right Side: Educational Assistant UI Card -->
  <g transform="translate(330, 45)">
    <!-- Window Frame -->
    <rect width="235" height="270" rx="12" fill="rgba(15, 23, 42, 0.9)" stroke="rgba(59, 130, 246, 0.35)" stroke-width="1.5"/>

    <!-- Window Header -->
    <rect width="235" height="34" rx="12" fill="#0f172a"/>
    <circle cx="16" cy="17" r="4" fill="#ef4444"/>
    <circle cx="28" cy="17" r="4" fill="#f59e0b"/>
    <circle cx="40" cy="17" r="4" fill="#10b981"/>
    <text x="60" y="21" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="600">EDUPILOT AI TUTOR</text>

    <!-- AI Chat Dialog Bubble 1 (User Query) -->
    <g transform="translate(14, 48)">
      <rect width="207" height="36" rx="8" fill="rgba(59, 130, 246, 0.15)" stroke="rgba(59, 130, 246, 0.3)"/>
      <text x="10" y="16" fill="#93c5fd" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="bold">STUDENT INQUIRY:</text>
      <text x="10" y="28" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5">Explain Dijkstra Algorithm &amp; complexity</text>
    </g>

    <!-- AI Response Bubble 2 -->
    <g transform="translate(14, 94)">
      <rect width="207" height="90" rx="8" fill="rgba(30, 41, 59, 0.8)" stroke="rgba(255, 255, 255, 0.08)"/>
      <text x="10" y="18" fill="#38bdf8" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="bold">🤖 EDUPILOT RESPONSE:</text>
      <text x="10" y="34" fill="#cbd5e1" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5">• Greedily selects vertex with min dist</text>
      <text x="10" y="48" fill="#cbd5e1" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5">• Time: O((V + E) log V) with Min-Heap</text>
      <text x="10" y="62" fill="#34d399" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5">✓ Interactive visual quiz generated</text>
      <text x="10" y="76" fill="#a855f7" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5">→ Progress: Module 4 completed (95%)</text>
    </g>

    <!-- Learning Metrics Bar -->
    <g transform="translate(14, 195)">
      <rect width="207" height="55" rx="8" fill="rgba(15, 23, 42, 0.7)" stroke="rgba(6, 182, 212, 0.25)"/>
      <text x="10" y="18" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="8">STUDENT MASTERY LEVEL</text>
      <text x="10" y="34" fill="#38bdf8" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="bold">Advanced • 89.2% Score</text>
      <rect x="10" y="42" width="187" height="4" rx="2" fill="rgba(255,255,255,0.08)"/>
      <rect x="10" y="42" width="165" height="4" rx="2" fill="url(#ep-blue)"/>
    </g>
  </g>

  <!-- Tag Pill -->
  <g transform="translate(30, 25)">
    <rect width="160" height="26" rx="13" fill="rgba(30, 58, 138, 0.85)" stroke="#60a5fa" stroke-width="1.2"/>
    <text x="80" y="17" fill="#bfdbfe" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="bold" text-anchor="middle">AI in Education &amp; EdTech</text>
  </g>
</svg>

