<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="eq-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="eq-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="360" fill="url(#eq-bg)"/>

  <!-- Browser/Dashboard Window Frame -->
  <g transform="translate(45, 35)">
    <!-- Main Window Background -->
    <rect width="510" height="290" rx="12" fill="url(#card-grad)" stroke="rgba(99, 102, 241, 0.3)" stroke-width="1.5"/>

    <!-- Window Header -->
    <rect width="510" height="34" rx="12" fill="#0f172a"/>
    <circle cx="20" cy="17" r="4.5" fill="#ef4444"/>
    <circle cx="36" cy="17" r="4.5" fill="#f59e0b"/>
    <circle cx="52" cy="17" r="4.5" fill="#10b981"/>
    <!-- Search Bar -->
    <rect x="80" y="8" width="220" height="18" rx="9" fill="rgba(255,255,255,0.06)"/>
    <text x="100" y="21" fill="#64748b" font-family="'Plus Jakarta Sans', sans-serif" font-size="9">eventiq.iem.edu/dashboard</text>

    <!-- Sidebar -->
    <rect x="0" y="34" width="70" height="256" fill="rgba(15, 23, 42, 0.6)"/>
    <rect x="12" y="50" width="46" height="6" rx="3" fill="#6366f1"/>
    <rect x="12" y="66" width="36" height="5" rx="2.5" fill="#475569"/>
    <rect x="12" y="80" width="40" height="5" rx="2.5" fill="#475569"/>
    <rect x="12" y="94" width="30" height="5" rx="2.5" fill="#475569"/>

    <!-- Content Area: Stat widgets -->
    <!-- Metric 1 -->
    <rect x="85" y="48" width="95" height="55" rx="8" fill="#1e293b" stroke="rgba(255,255,255,0.08)"/>
    <text x="97" y="66" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="8">TOTAL ATTENDEES</text>
    <text x="97" y="88" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="bold">1,480+</text>

    <!-- Metric 2 -->
    <rect x="190" y="48" width="95" height="55" rx="8" fill="#1e293b" stroke="rgba(255,255,255,0.08)"/>
    <text x="202" y="66" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="8">ACTIVE EVENTS</text>
    <text x="202" y="88" fill="#38bdf8" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="bold">12 Live</text>

    <!-- Metric 3 -->
    <rect x="295" y="48" width="95" height="55" rx="8" fill="#1e293b" stroke="rgba(255,255,255,0.08)"/>
    <text x="307" y="66" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="8">TICKET SALES</text>
    <text x="307" y="88" fill="#10b981" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="bold">98.4%</text>

    <!-- Metric 4 -->
    <rect x="400" y="48" width="95" height="55" rx="8" fill="url(#eq-accent)"/>
    <text x="412" y="66" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="8">QUICK ACTION</text>
    <text x="412" y="88" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="bold">+ New Event</text>

    <!-- Main Chart / Event schedule table -->
    <rect x="85" y="115" width="280" height="155" rx="8" fill="#1e293b" stroke="rgba(255,255,255,0.08)"/>
    <text x="100" y="135" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600">Event Registrations Over Time</text>

    <!-- Sparkline / Wave chart -->
    <path d="M 100 230 Q 140 170 180 200 T 260 160 T 340 145" fill="none" stroke="#6366f1" stroke-width="3"/>
    <path d="M 100 230 Q 140 170 180 200 T 260 160 T 340 145 L 340 245 L 100 245 Z" fill="url(#eq-accent)" opacity="0.15"/>

    <!-- Mini Calendar / Schedule Card -->
    <rect x="375" y="115" width="120" height="155" rx="8" fill="#1e293b" stroke="rgba(255,255,255,0.08)"/>
    <text x="387" y="135" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600">Upcoming</text>

    <rect x="385" y="148" width="100" height="30" rx="4" fill="#0f172a"/>
    <text x="393" y="162" fill="#38bdf8" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="bold">TechFest 2026</text>
    <text x="393" y="172" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="7">Auditorium A • 10 AM</text>

    <rect x="385" y="186" width="100" height="30" rx="4" fill="#0f172a"/>
    <text x="393" y="200" fill="#ec4899" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="bold">HackIEM 24hr</text>
    <text x="393" y="210" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="7">Innovation Lab • 1 PM</text>

    <rect x="385" y="224" width="100" height="30" rx="4" fill="#0f172a"/>
    <text x="393" y="238" fill="#10b981" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="bold">AI Workshop</text>
    <text x="393" y="248" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="7">Seminar Hall • 3 PM</text>
  </g>
</svg>

