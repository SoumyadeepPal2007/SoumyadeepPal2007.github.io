<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="tr-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#1e1e38" />
    </linearGradient>
    <linearGradient id="ticket-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="rail-neon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
  </defs>

  <rect width="600" height="360" fill="url(#tr-bg)"/>

  <!-- High speed train aerodynamic graphic in background -->
  <g opacity="0.25">
    <path d="M 0 280 L 600 280" stroke="#38bdf8" stroke-width="2"/>
    <path d="M 0 300 L 600 300" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="10 10"/>
  </g>

  <!-- Modern Ticket / Reservation Interface Card -->
  <g transform="translate(60, 45)">
    <!-- Ticket Card Frame -->
    <rect width="480" height="260" rx="16" fill="url(#ticket-grad)" stroke="rgba(99, 102, 241, 0.4)" stroke-width="2"/>

    <!-- Left Header Banner -->
    <path d="M 0 16 C 0 7.16 7.16 0 16 0 L 464 0 C 472.84 0 480 7.16 480 16 L 480 50 L 0 50 Z" fill="#1e1b4b"/>
    <text x="25" y="32" fill="#38bdf8" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700">RAPIDRAIL RESERVATION PORTAL</text>
    <rect x="360" y="16" width="95" height="22" rx="11" fill="rgba(16, 185, 129, 0.2)" stroke="#10b981" stroke-width="1"/>
    <text x="407" y="31" fill="#10b981" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="bold" text-anchor="middle">CONFIRMED (CNF)</text>

    <!-- Route Path: Station A to Station B -->
    <g transform="translate(30, 75)">
      <!-- Origin -->
      <circle cx="15" cy="25" r="8" fill="#38bdf8"/>
      <circle cx="15" cy="25" r="3" fill="#ffffff"/>
      <text x="35" y="22" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="9">ORIGIN</text>
      <text x="35" y="37" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="bold">HWH / HOWRAH</text>

      <!-- Track line -->
      <line x1="165" y1="25" x2="255" y2="25" stroke="url(#rail-neon)" stroke-width="3" stroke-dasharray="6 4"/>
      <polygon points="215,20 225,25 215,30" fill="#6366f1"/>

      <!-- Destination -->
      <circle cx="280" cy="25" r="8" fill="#a855f7"/>
      <circle cx="280" cy="25" r="3" fill="#ffffff"/>
      <text x="300" y="22" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="9">DESTINATION</text>
      <text x="300" y="37" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="bold">NDLS / NEW DELHI</text>
    </g>

    <!-- Divider perforated line -->
    <line x1="25" y1="140" x2="455" y2="140" stroke="rgba(255,255,255,0.1)" stroke-width="1.5" stroke-dasharray="8 6"/>

    <!-- Passenger & Coach Details Grid -->
    <g transform="translate(30, 160)">
      <g transform="translate(0, 0)">
        <text x="0" y="12" fill="#64748b" font-family="'Plus Jakarta Sans', sans-serif" font-size="8">TRAIN NAME &amp; NO.</text>
        <text x="0" y="30" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600">RAJDHANI EXP #12301</text>
      </g>
      <g transform="translate(150, 0)">
        <text x="0" y="12" fill="#64748b" font-family="'Plus Jakarta Sans', sans-serif" font-size="8">COACH &amp; BERTH</text>
        <text x="0" y="30" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold">B4 - 36 [LOWER]</text>
      </g>
      <g transform="translate(290, 0)">
        <text x="0" y="12" fill="#64748b" font-family="'Plus Jakarta Sans', sans-serif" font-size="8">PNR NUMBER</text>
        <text x="0" y="30" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold">6729-482015</text>
      </g>
    </g>

    <!-- Quick action footer within ticket -->
    <rect x="25" y="210" width="430" height="34" rx="8" fill="#0f172a" stroke="rgba(255,255,255,0.06)"/>
    <text x="40" y="231" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="10">✓ System Status: Transaction Committed (ACID Compliant)</text>
    <rect x="345" y="216" width="95" height="22" rx="6" fill="#4f46e5"/>
    <text x="392" y="231" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="bold" text-anchor="middle">View e-Ticket</text>
  </g>
</svg>

